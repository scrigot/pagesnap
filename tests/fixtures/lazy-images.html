<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <script src="bands.js"></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
    </style>
    <title>Lazy images</title>
    <style>
      img {
        display: block;
        width: 100%;
        height: 400px;
      }
    </style>
  </head>
  <body>
    <div id="c"></div>
    <script>
      // Images are served with a 300 ms delay and loading=lazy; PageSnap must wait for them.
      for (let i = 0; i < 12; i++) {
        const img = document.createElement('img');
        img.loading = 'lazy';
        img.src = '/slow-image.svg?i=' + i;
        c.appendChild(img);
      }
    </script>
  </body>
</html>
