name: Bug report
description: Something did not capture, stitch, or copy correctly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected vs. what you got. Attach the captured PNG only if the page is public and non-sensitive.
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page URL (if public)
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser, version, OS, display scale, zoom
      placeholder: Chrome 131, macOS 15, Retina (2x), 100%
    validations:
      required: true
  - type: textarea
    id: diag
    attributes:
      label: Diagnostics log
      description: Settings > Diagnostics > Copy log. It contains origins and sizes, not page content.
      render: json
